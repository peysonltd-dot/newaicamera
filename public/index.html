<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <title>Live Print 現場客製化</title>
  <meta name="description" content="彩印/雷雕/燙布章/個性化現場禮品">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PEYSON">
  <meta property="og:title" content="Live Print 現場客製化">
  <meta property="og:description" content="彩印/雷雕/燙布章/個性化現場禮品">
  <meta property="og:url" content="https://peyson-laser-liveprint.onrender.com/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Live Print 現場客製化">
  <meta name="twitter:description" content="彩印/雷雕/燙布章/個性化現場禮品">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="front-body">
  <main class="front-shell">
    <header class="brand-header">
      <div class="eyebrow">PEYSON LIVE ENGRAVING</div>
      <h1 id="eventName">現場雷雕體驗</h1>
      <p id="eventSubtitle">自由打字・手寫簽名・專屬創作</p>
    </header>

    <section id="editorStep" class="panel editor-panel">
      <div class="editor-heading">
        <div>
          <div class="step-kicker">DESIGN</div>
          <h2 id="editorTitle">設計雷雕內容</h2>
          <p class="editor-intro">可自由選擇打字、手寫，或兩者一起使用。</p>
        </div>
      </div>

      <div id="typingTools" class="typing-tools">
        <label class="input-label" for="textInput">輸入文字（可留白）</label>
        <div class="text-input-wrap">
          <input id="textInput" type="text" autocomplete="off" inputmode="text" placeholder="請輸入文字，或直接在下方手寫">
          <span id="charCounter">0 / 20</span>
        </div>
        <div class="input-label">選擇字體</div>
        <div id="fontChoices" class="font-grid"></div>
      </div>

      <div id="handwritingTools" class="tool-row">
        <div class="tool-group">
          <span class="tool-label">手寫筆畫粗細</span>
          <div id="widthChoices" class="segmented"></div>
        </div>
        <div class="tool-actions">
          <button id="undoButton" class="secondary-button bilingual-button" type="button"><span class="button-main"><span class="button-symbol" aria-hidden="true">↶</span>復原</span><small class="button-en">Undo</small></button>
          <button id="redoButton" class="secondary-button bilingual-button" type="button"><span class="button-main"><span class="button-symbol" aria-hidden="true">↷</span>重做</span><small class="button-en">Redo</small></button>
          <button id="clearButton" class="secondary-button danger-text bilingual-button" type="button"><span class="button-main">清除手寫</span><small class="button-en">Clear</small></button>
        </div>
      </div>

      <div class="canvas-label-row">
        <span>雷雕範圍預覽</span>
        <small>灰色框線不會輸出</small>
      </div>
      <div id="canvasStage" class="canvas-stage">
        <canvas id="designCanvas"></canvas>
        <div id="emptyHint" class="canvas-empty">
          <b>請輸入文字或在框內書寫</b>
          <span>打字與手寫內容會合成為同一張雷雕圖</span>
        </div>
      </div>

      <div class="editor-footer">
        <p>送出後將自動產生取件號碼，內容送出後無法修改。</p>
        <button id="submitButton" class="primary-button bilingual-button" type="button"><span class="button-main">確認送出</span><small class="button-en">Submit</small></button>
      </div>
    </section>

    <section id="successStep" class="panel success-panel hidden">
      <div class="success-check">✓</div>
      <div class="step-kicker">登記完成</div>
      <h2>您的取件號碼</h2>
      <div id="ticketNumber" class="ticket-number">001</div>
      <p id="printMessage">票券將由出票機自動印出，請妥善保留。</p>
      <button id="newOrderButton" class="primary-button bilingual-button" type="button"><span class="button-main">下一位</span><small class="button-en">Next</small></button>
    </section>
  </main>

  <div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <b>正在送出，請稍候…</b>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/app.js"></script>
</body>
</html>
